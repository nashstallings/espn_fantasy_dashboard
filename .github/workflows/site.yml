name: Build and publish the dashboard

# The whole site is a build artifact: fetch ESPN, write JSON, publish to Pages.
# No server is involved, so there is nothing to keep running between builds.

# PAUSED. Automatic runs are switched off until the repository is configured —
# the build needs ESPN_SWID + ESPN_S2 (secrets) and LEAGUE_ID (variable), and
# without them every scheduled run failed at the first step.
#
# To switch it back on, add those, then uncomment the two triggers below:
#
#   schedule:
#     # Every 15 minutes. GitHub treats scheduled runs as best-effort and delays
#     # them under load — especially at the top of the hour — so treat this as
#     # "about every 15-40 minutes", which is why the page stamps its own age.
#     - cron: "*/15 * * * *"
#   push:
#     branches: [main]
#     paths:
#       - "frontend/**"
#       - "backend/src/espn_dashboard/**"
#       - ".github/workflows/site.yml"
#
# Until then it runs only when started by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never publish an older build over a newer one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Fetch ESPN and write the data files
        env:
          # Cookies live in repository secrets and reach only this step. The
          # build refuses to publish if any of it ends up in the output tree.
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          LEAGUE_ID: ${{ vars.LEAGUE_ID }}
          SEASON: ${{ vars.SEASON }}
          OUTPUT_DIR: frontend/data
          PYTHONPATH: backend/src
        run: python -m espn_dashboard.build_site

      - name: Confirm the build produced a usable site
        run: |
          test -s frontend/data/index.json || { echo "::error::no index.json"; exit 1; }
          test -s frontend/data/standings.json || { echo "::error::no standings.json"; exit 1; }
          echo "Built $(find frontend/data -name '*.json' | wc -l) data files"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          # The data files are uploaded from the workspace and never committed:
          # this repository is public, and committed league data would live in
          # git history permanently and be search-indexable.
          path: frontend

      - id: deployment
        uses: actions/deploy-pages@v4

  # History still goes to BigQuery, so season-long trends survive the move off
  # Cloud Run. Separate job: a BigQuery hiccup must not block publishing.
  snapshot:
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name != 'push' &&
      vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
      vars.GCP_DEPLOY_SERVICE_ACCOUNT != ''
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Snapshot the league into BigQuery
        env:
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          LEAGUE_ID: ${{ vars.LEAGUE_ID }}
          SEASON: ${{ vars.SEASON }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT || 'ff-python-api' }}
          BIGQUERY_DATASET: ${{ vars.BIGQUERY_DATASET || 'espn_fantasy' }}
          PYTHONPATH: backend/src
        run: python -m espn_dashboard.snapshot_league
